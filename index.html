<!DOCTYPE html>

<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AH JKJ • KING.SAKK</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
}

body{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow-x:hidden;

    font-family:
        Arial,
        "Noto Sans Khmer",
        sans-serif;

    color:white;

    background:#020609;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;

    z-index:-10;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #07313b 0%,
            #04151c 22%,
            #010508 65%,
            #000 100%
        );
}

/* Glow */
.glow{
    position:absolute;

    width:300px;
    height:300px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#00eaff;

    filter:blur(120px);

    opacity:.13;
}

/* =========================
   GRID
========================= */

.grid{
    position:absolute;

    width:200%;
    height:200%;

    left:-50%;
    top:35%;

    background-image:
        linear-gradient(
            rgba(0,234,255,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,234,255,.055) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    transform:
        perspective(450px)
        rotateX(60deg);

    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 40px;
    }

}

/* =========================
   PARTICLES
========================= */

#particles{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-5;
}

.particle{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 15px #00eaff;

    animation:
        particleUp
        linear
        infinite;
}

@keyframes particleUp{

    0%{
        transform:translateY(110vh);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    100%{
        transform:translateY(-20vh);
        opacity:0;
    }

}

/* =========================
   SCAN LINE
========================= */

.scan{
    position:fixed;

    left:0;

    width:100%;
    height:2px;

    background:#00eaff;

    opacity:.12;

    box-shadow:
        0 0 15px #00eaff;

    pointer-events:none;

    z-index:20;

    animation:scanMove 5s linear infinite;
}

@keyframes scanMove{

    from{
        top:-5px;
    }

    to{
        top:105vh;
    }

}

/* =========================
   MAIN CARD
========================= */

.card{

    position:relative;

    width:100%;
    max-width:620px;

    padding:28px 22px 24px;

    text-align:center;

    border-radius:28px;

    border:1px solid
        rgba(0,234,255,.28);

    background:
        rgba(2,10,15,.72);

    backdrop-filter:blur(14px);

    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 0 25px
        rgba(0,234,255,.12),

        inset 0 0 35px
        rgba(0,234,255,.035);

    animation:cardIn .9s ease;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            scale(.88)
            translateY(30px);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
    }

}

/* =========================
   LABEL
========================= */

.label{

    display:inline-block;

    margin-bottom:24px;

    padding:7px 14px;

    border-radius:50px;

    border:1px solid
        rgba(0,234,255,.45);

    color:#00eaff;

    font-size:10px;

    font-weight:bold;

    letter-spacing:2.5px;

    box-shadow:
        0 0 12px
        rgba(0,234,255,.12);

}

/* =========================
   PHOTO
========================= */

.photo-area{

    position:relative;

    width:260px;
    height:260px;

    margin:0 auto 28px;

}

/* Outer ring */
.photo-area::before{

    content:"";

    position:absolute;

    inset:-10px;

    border-radius:32px;

    border:
        2px solid
        transparent;

    border-top-color:#00eaff;
    border-right-color:#00eaff;

    filter:
        drop-shadow(
            0 0 8px #00eaff
        );

    animation:
        spin 4s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* Photo */

.photo{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    border-radius:25px;

    border:3px solid #00eaff;

    box-shadow:

        0 0 15px #00eaff,

        0 0 40px
        rgba(0,234,255,.4),

        0 0 80px
        rgba(0,234,255,.15);

    animation:photoFloat 3s ease-in-out infinite;

}

@keyframes photoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}

/* =========================
   TITLE
========================= */

.title{

    font-size:
        clamp(36px,10vw,65px);

    font-weight:1000;

    letter-spacing:
        clamp(3px,1.5vw,8px);

    color:#fff;

    text-shadow:

        0 0 6px #fff,

        0 0 16px #00eaff,

        0 0 35px #00eaff,

        0 0 65px #00eaff;

    animation:titleGlow 2s ease-in-out infinite alternate;

}

@keyframes titleGlow{

    from{
        opacity:.8;
    }

    to{
        opacity:1;
    }

}

/* =========================
   LINE
========================= */

.line{

    width:180px;
    max-width:60%;

    height:3px;

    margin:18px auto;

    border-radius:50px;

    background:#00eaff;

    box-shadow:

        0 0 8px #00eaff,

        0 0 20px #00eaff,

        0 0 35px #00eaff;

}

/* =========================
   MESSAGE
========================= */

.message{

    width:100%;

    padding:17px 14px;

    border-radius:17px;

    border-left:
        3px solid #00eaff;

    border-right:
        3px solid #00eaff;

    background:
        rgba(0,234,255,.035);

    color:#fff;

    font-size:
        clamp(17px,4.3vw,25px);

    font-weight:900;

    line-height:1.9;

    overflow-wrap:anywhere;

    word-break:break-word;

    text-shadow:

        0 0 5px #fff,

        0 0 13px #00eaff;

}

/* =========================
   FOOTER
========================= */

.footer{

    margin-top:18px;

    color:
        rgba(255,255,255,.4);

    font-size:9px;

    letter-spacing:3px;

}

/* =========================
   CORNERS
========================= */

.corner{

    position:fixed;

    width:32px;
    height:32px;

    opacity:.35;

    border-color:#00eaff;

    z-index:30;

}

.tl{
    top:12px;
    left:12px;

    border-style:solid;

    border-width:2px 0 0 2px;
}

.tr{
    top:12px;
    right:12px;

    border-style:solid;

    border-width:2px 2px 0 0;
}

.bl{
    bottom:12px;
    left:12px;

    border-style:solid;

    border-width:0 0 2px 2px;
}

.br{
    bottom:12px;
    right:12px;

    border-style:solid;

    border-width:0 2px 2px 0;
}

/* =========================
   PHONE
========================= */

@media(max-width:600px){

    body{

        align-items:flex-start;

        padding:
            25px
            12px
            25px;

        overflow-y:auto;

    }

    .card{

        max-width:430px;

        padding:
            25px
            14px
            20px;

        border-radius:24px;

    }

    .label{

        margin-bottom:22px;

        font-size:9px;

        letter-spacing:2px;

    }

    .photo-area{

        width:200px;
        height:200px;

        margin-bottom:25px;

    }

    .photo{

        border-radius:20px;

    }

    .title{

        font-size:34px;

        letter-spacing:4px;

    }

    .message{

        margin-top:0;

        padding:
            14px
            10px;

        font-size:17px;

        line-height:1.85;

        border-radius:15px;

    }

    .footer{

        margin-top:15px;

        font-size:8px;

    }

}

/* =========================
   SMALL PHONE
========================= */

@media(max-width:380px){

    body{

        padding:
            18px
            9px
            20px;

    }

    .card{

        padding:
            22px
            10px
            18px;

    }

    .photo-area{

        width:165px;
        height:165px;

        margin-bottom:22px;

    }

    .title{

        font-size:29px;

    }

    .message{

        font-size:15px;

        line-height:1.85;

        padding:
            12px
            9px;

    }

}

/* =========================
   VERY SMALL PHONE
========================= */

@media(max-width:330px){

    .photo-area{

        width:145px;
        height:145px;

    }

    .title{

        font-size:25px;

    }

    .message{

        font-size:14px;

    }

}

</style>

</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<div class="background">


<div class="glow"></div>

<div class="grid"></div>


</div>

<div id="particles"></div>

<div class="scan"></div>

<!-- Corners -->

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- =========================
     MAIN
========================= -->

<main class="card">

```
<div class="label">
    ● SYSTEM ONLINE • KING.SAKK
</div>


<!-- PHOTO -->

<div class="photo-area">

    <img
        class="photo"
        src="https://i.postimg.cc/p2VMwS05/photo-2026-09-01-15-51-43.jpg"
        alt="Photo"
    >

</div>


<!-- TITLE -->

<div class="title">
    AH JKJ
</div>


<div class="line"></div>


<!-- MESSAGE -->

<div class="message">

    កាដួយម៉ែអា king.sakk
    អាកូនមីចោកាចុយ king.sakk
    ហែងកុំភ្លើពេកអាចុយម្រាយហែង
    Jo អីក៏ Jo មេះ
    អាថោកទាបនេះ🥰🥰

</div>


<div class="footer">
    NEON SYSTEM • 2026
</div>


</main>

<script>

/* =========================
   PARTICLES
========================= */

const particleBox =
    document.getElementById("particles");

for(let i = 0; i < 45; i++){

    const p =
        document.createElement("div");

    p.className = "particle";

    p.style.left =
        Math.random() * 100 + "%";

    p.style.animationDuration =
        (4 + Math.random() * 6) + "s";

    p.style.animationDelay =
        (-Math.random() * 8) + "s";

    const size =
        1 + Math.random() * 3;

    p.style.width =
        size + "px";

    p.style.height =
        size + "px";

    particleBox.appendChild(p);

}


/* =========================
   DESKTOP 3D EFFECT
========================= */

const card =
    document.querySelector(".card");

document.addEventListener(
    "mousemove",
    function(e){

        if(window.innerWidth <= 600)
            return;

        const x =
            (e.clientX /
            window.innerWidth - .5) * 2;

        const y =
            (e.clientY /
            window.innerHeight - .5) * 2;

        card.style.transform =
            `perspective(1000px)
             rotateY(${x * 2.5}deg)
             rotateX(${y * -2.5}deg)`;

    }
);


/* Reset */

document.addEventListener(
    "mouseleave",
    function(){

        card.style.transform =
            "perspective(1000px) rotateY(0deg) rotateX(0deg)";

    }
);

</script>

</body>
</html>
